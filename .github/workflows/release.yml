name: 🚀 Publish Release
on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag to use for the release (e.g., v0.1.0)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: Setup Bun
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Package Extension
        run: bun run vsce package

      - name: Publish to VSCode Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bun run vsce publish

      - name: Upload VSIX to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
